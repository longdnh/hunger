services:
  hunger-pg:
    image: postgres:18
    container_name: hunger-pg
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hunger-pg}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - hunger-pg:/var/lib/postgresql
  
  hunger-redis:
    image: redis:7
    container_name: hunger-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - hunger-redis:/data

volumes:
  hunger-pg:
  hunger-redis:
