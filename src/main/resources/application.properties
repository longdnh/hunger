spring.application.name=hunger
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hunger}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jwt
security.jwt.issuer=${JWT_ISSUER:https://hunger.local}
security.jwt.audience=hunger-api
security.jwt.access-token-ttl=10m
security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:file:.local/keys/access-token-private.pem}
security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:file:.local/keys/access-token-public.pem}
security.authentication.refresh-token-ttl=${REFRESH_TOKEN_TTL:30d}

security.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Refresh token cookie
security.authentication.refresh-cookie.name=${REFRESH_COOKIE_NAME:refresh_token}
security.authentication.refresh-cookie.path=/api/v1/auth
security.authentication.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
security.authentication.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}

# Top-admin bootstrap
security.bootstrap.top-admin.enabled=${TOP_ADMIN_BOOTSTRAP_ENABLED:false}
security.bootstrap.top-admin.name=${TOP_ADMIN_NAME:}
security.bootstrap.top-admin.email=${TOP_ADMIN_EMAIL:}
security.bootstrap.top-admin.password=${TOP_ADMIN_PASSWORD:}
security.user.activation-token-ttl=${USER_ACTIVATION_TOKEN_TTL:24h}
security.invitation.invitation-ttl=${INVITATION_TTL:7d}
