services:
  hunger:
    image: postgres:18
    container_name: hunger
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hunger}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - hunger:/var/lib/postgresql
  
  hunger-redis:
    image: redis:7
    container_name: hunger-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - hunger:/data

volumes:
  hunger:
