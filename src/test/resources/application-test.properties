spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hunger}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:postgres}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${TEST_DB_SCHEMA:hunger_test}
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.default-schema=${TEST_DB_SCHEMA:hunger_test}
spring.flyway.schemas=${TEST_DB_SCHEMA:hunger_test}
